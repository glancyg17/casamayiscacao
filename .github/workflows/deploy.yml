name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # VISTA PREVIA (por defecto): se publica en https://USUARIO.github.io/REPOSITORIO/ y no se indexa.
    # LANZAMIENTO: crea la variable de repositorio PRODUCTION = true
    # (Settings > Secrets and variables > Actions > Variables) y vuelve a correr este workflow.
    env:
      SITE_URL: ${{ vars.PRODUCTION == 'true' && 'https://casamayis.com' || format('https://{0}.github.io', github.repository_owner) }}
      SITE_BASE: ${{ vars.PRODUCTION == 'true' && '/' || format('/{0}', github.event.repository.name) }}
      PREVIEW: ${{ vars.PRODUCTION == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
